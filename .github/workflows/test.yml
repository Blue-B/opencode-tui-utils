name: Compatibility & Build Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Check plugin structure
        run: |
          if [ ! -f "dist/plugins/disconnect.js" ]; then
            echo "ERROR: disconnect.js not found"
            exit 1
          fi
          if [ ! -f "dist/plugins/bookmarks.js" ]; then
            echo "ERROR: bookmarks.js not found"
            exit 1
          fi
          echo "✓ All plugin files generated successfully"
      
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts-node${{ matrix.node-version }}
          path: dist/

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npx tsc --noEmit
      
      - name: Check code structure
        run: |
          echo "Checking for API wrapper usage..."
          # Ensure plugins use createWrappedAPI
          if ! grep -r "createWrappedAPI" src/plugins/ > /dev/null; then
            echo "WARNING: Not all plugins use API wrapper"
          else
            echo "✓ API wrapper usage verified"
          fi
      
      - name: Check JSDoc comments
        run: |
          echo "Checking for JSDoc documentation..."
          if ! grep -r "/**" src/core/ > /dev/null; then
            echo "WARNING: Core modules should have JSDoc comments"
          fi

  compatibility:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate package.json compatibility settings
        run: |
          node -e "
          const pkg = require('./package.json');
          
          // Check peerDependencies
          if (!pkg.peerDependencies || !pkg.peerDependencies['@opencode-ai/plugin']) {
            console.error('Missing @opencode-ai/plugin in peerDependencies');
            process.exit(1);
          }
          
          // Check minimum version
          const version = pkg.peerDependencies['@opencode-ai/plugin'];
          if (!version.includes('>=1.14.42')) {
            console.error('Minimum opencode version must be >=1.14.42');
            process.exit(1);
          }
          
          console.log('✓ Compatibility settings valid');
          console.log('  - Min opencode: ' + version);
          console.log('  - Current dev version: ' + pkg.devDependencies['@opencode-ai/plugin']);
          "

  notify:
    runs-on: ubuntu-latest
    needs: [build, lint, compatibility]
    if: always()
    
    steps:
      - name: Check job status
        if: failure()
        run: |
          echo "❌ One or more checks failed"
          exit 1
      
      - name: Success
        if: success()
        run: echo "✅ All checks passed"
